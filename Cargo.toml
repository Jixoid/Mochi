[package]
name = "Mochi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.package]
license = "GPL-3.0-only"

[workspace]
members = [
  "crates/*"
]

[dependencies]
bitflags = "2.13.2"
raw-window-handle = "0.6"
winit = "0.30"
mochi_rhi = { path = "crates/mochi_rhi" }
mochi_rhi_ash = { path = "crates/mochi_rhi_ash" }
mochi_ahi = { path = "crates/mochi_ahi" }
mochi_ahi_cpal = { path = "crates/mochi_ahi_cpal" }
mochi_math = { path = "crates/mochi_math" }
mochi_except = { path = "crates/mochi_except" }
hecs = "0.10"
bytemuck = { version = "1.25", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
bincode = "1.3"
libloading = "0.8"
gltf = { version = "1.4.1", features = ["image", "guess_mime_type", "KHR_materials_transmission"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
