[package]
name = "mochi"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.package]
license = "GPL-3.0-only"

[workspace]
members = [
  "crates/*"
]

[dependencies]
mochi_core = { path = "crates/mochi_core" }
mochi_input = { path = "crates/mochi_input" }
mochi_display = { path = "crates/mochi_display" }
mochi_material = { path = "crates/mochi_material" }
mochi_audio = { path = "crates/mochi_audio" }
mochi_scene = { path = "crates/mochi_scene" }
mochi_rendering = { path = "crates/mochi_rendering" }
mochi_script = { path = "crates/mochi_script" }
mochi_asset = { path = "crates/mochi_asset" }
mochi_rhi = { path = "crates/mochi_rhi" }
mochi_rhi_ash = { path = "crates/mochi_rhi_ash" }
mochi_ahi = { path = "crates/mochi_ahi" }
mochi_ahi_cpal = { path = "crates/mochi_ahi_cpal" }
mochi_math = { path = "crates/mochi_math" }
mochi_except = { path = "crates/mochi_except" }
